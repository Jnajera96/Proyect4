<text x="80" y="1014" fill="#5F5E5A" font-family="Segoe UI, Arial, sans-serif" font-size="12">Linea continua: flujo principal. Linea discontinua: flujo opcional o transversal.</text>
<text x="80" y="1032" fill="#5F5E5A" font-family="Segoe UI, Arial, sans-serif" font-size="12">El repositorio del usuario no se modifica hasta que se aprueba la promocion desde el worktree.</text>
<text x="80" y="1050" fill="#5F5E5A" font-family="Segoe UI, Arial, sans-serif" font-size="12">Todos los agentes comparten el proveedor de modelo. El Policy Engine decide antes de cada llamada a herramienta.</text>
