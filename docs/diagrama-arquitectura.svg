<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1080" width="1400" height="1080" role="img" aria-labelledby="dtitle ddesc">
<title id="dtitle">Arquitectura del AI Software Engineering System</title>
<desc id="ddesc">Entrada por voz o texto; el adaptador Speech-to-Text convierte audio en texto confirmado por el usuario. La API FastAPI entrega la tarea al Supervisor en LangGraph, que coordina Researcher, Coder y Reviewer sobre un worktree aislado. Las herramientas se exponen por MCP y pasan por el Policy Engine. El estado compartido permite reanudar la ejecucion y la aprobacion humana protege las acciones con efectos. La observabilidad y el proveedor de modelo son servicios externos; el Text-to-Speech es opcional.</desc>
