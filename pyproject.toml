[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-swe-system"
version = "0.2.0"
description = "Proyecto 4 - AI Software Engineering System: sistema multiagente para tareas de ingenieria de software"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }

# Dependencias justificadas en docs/02-tecnologias.md. Ninguna entra sin
# responder las ocho preguntas de esa seccion.
#
# Politica de versiones (aplicada desde F1; el conjunto documental del que salio
# esta archivado en docs/history/auditoria-2026-10-06/):
#   - Rango con techo de version MAYOR cuando la API se usa de verdad.
#     El techo evita que una actualizacion mayor rompa el proyecto sin avisar,
#     que es el fallo mas caro de diagnosticar.
#   - Rango abierto (`>=`) solo para dependencias que no se importan en `src/`.
#   - No se fija la version EXACTA aqui: de eso se encarga `uv.lock`.
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    # Necesaria para `UploadFile` y `Form`: sin ella FastAPI falla al arrancar las
    # rutas que reciben audio. Se descubrio al ejecutar las pruebas de la API.
    "python-multipart>=0.0.9,<1",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    # LangGraph: el proyecto se construyo y verifico sobre la rama 1.x (1.2.14).
    # Declarar `>=0.2` era falso: prometia compatibilidad con una rama mayor que
    # nunca se probo y cuya API difiere. Se declara la rama REAL.
    "langgraph>=1.2,<2",
    "langgraph-checkpoint-sqlite>=3.1,<4",
    "httpx>=0.27,<1",
    "cryptography==50.0.2",
    "sse-starlette>=2.1,<4",
]

[project.optional-dependencies]
packaging = ["pyinstaller==6.22.3"]
# SDK MCP opcional para ampliaciones. El cliente/servidor stdio propio no lo usa
# ni requiere instalarlo; no se añade al runtime portable por esta capacidad.
mcp = [
    "mcp>=1.0",
]
# Speech-to-Text local. Opcional por diseno: el sistema funciona sin voz.
voice = [
    "faster-whisper>=1.0",
    # faster-whisper 1.2.1 usa av.open(metadata_errors=...), eliminado en PyAV 19.
    "av<19",
]
# SDK opcional: la exportación OTLP/HTTP propia usa httpx ya instalado, no este extra.
observability = [
    "langfuse>=2.50",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]
token-metrics = [
    "tiktoken>=0.12,<1",
]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    # Pruebas de integracion real: exigen credenciales y red. NO se ejecutan en la
    # suite normal; se saltan salvo que se pidan explicitamente. Una API externa
    # nunca debe ser dependencia del CI.
    "real_provider: integracion real con un proveedor; requiere AI_SWE_MODEL_API_KEY y AI_SWE_RUN_REAL_PROVIDER_TESTS=1",
    # Transcripcion real (F13): exige el extra `voice` instalado y descarga un
    # modelo de cientos de MB. Se salta salvo que se pida explicitamente, por el
    # mismo motivo que `real_provider`: una descarga pesada no puede ser dependencia
    # de la suite normal.
    "real_stt: transcripcion real con faster-whisper; requiere el extra `voice` y AI_SWE_RUN_REAL_STT_TESTS=1",
]
# No se rota ni se borra nada al terminar: cada borrado es una ocasion de que el
# interceptor de este entorno interfiera. Los directorios se acumulan en el
# temporal del sistema y se pueden borrar a mano cuando molesten.
#
# NO se fija `--basetemp`: con una ruta fija, dos sesiones de pytest simultaneas
# se destruyen los directorios entre si, porque pytest limpia el basetemp al
# empezar. Ese peligro oculto es peor que el problema que resolvia.
tmp_path_retention_policy = "none"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.hatch.build.targets.wheel]
packages = ["src/ai_swe"]
